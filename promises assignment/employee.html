 <!DOCTYPE html>
<html>
<head>
    <title>Employee Management System</title>
</head>

<body>

<h1>Employee Management System</h1>

<button onclick="getEmployees()">Get Employees</button>
<button onclick="addEmployee()">Add Employee</button>
<button onclick="updateEmployee()">Update Employee</button>
<button onclick="deleteEmployee()">Delete Employee</button>

<div id="output"></div>

<script>

const api = "https://jsonplaceholder.typicode.com/users";

// GET
function getEmployees() {

    fetch(api)

    .then(response => response.json())

    .then(data => {

        let output = "<h2>Employee List</h2>";

        data.forEach(employee => {

            output += `
                <hr>
                <p><b>ID:</b> ${employee.id}</p>
                <p><b>Name:</b> ${employee.name}</p>
                <p><b>Email:</b> ${employee.email}</p>
            `;
        });

        document.getElementById("output").innerHTML = output;

    })

    .catch(error => {

        document.getElementById("output").innerHTML =
        "Error Fetching Employees";

        console.log(error);

    });

}

// POST
function addEmployee() {

    fetch(api, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: "pranavi",
            email: "pranavi@gmail.com"
        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("output").innerHTML = `
            <h3>Employee Added Successfully</h3>
            <pre>${JSON.stringify(data)}</pre>
        `;

    })

    .catch(error => {

        document.getElementById("output").innerHTML =
        "Error Adding Employee";

        console.log(error);

    });

}

// PUT
function updateEmployee() {

    fetch(api + "/1", {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: "Updated Employee",
            email: "updated@gmail.com"
        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("output").innerHTML = `
            <h3>Employee Updated Successfully</h3>
            <pre>${JSON.stringify(data)}</pre>
        `;

    })

    .catch(error => {

        document.getElementById("output").innerHTML =
        "Error Updating Employee";

        console.log(error);

    });

}

// DELETE
function deleteEmployee() {

    fetch(api + "/1", {

        method: "DELETE"

    })

    .then(response => {

        document.getElementById("output").innerHTML =
        "<h3>Employee Deleted Successfully</h3>";

    })

    .catch(error => {

        document.getElementById("output").innerHTML =
        "Error Deleting Employee";

        console.log(error);

    });

}

</script>

</body>
</html>
