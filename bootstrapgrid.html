<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

  <h4 class="mb-3">Grid Layout (Colored)</h4>

  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-3 text-white p-3" style="background-color:#343a40;">
      <h5>Sidebar</h5>
      <p>Menu Links</p>
    </div>

    <!-- Main Content -->
    <div class="col-md-6 p-3" style="background-color:#f8f9fa;">

      <h5>Main Content</h5>

      <div class="row">

        <div class="col-md-6">
          <div class="p-3 text-white mb-2" style="background-color:#0d6efd;">Card 1</div>
        </div>

        <div class="col-md-6">
          <div class="p-3 text-white mb-2" style="background-color:#198754;">Card 2</div>
        </div>

        <div class="col-md-6">
          <div class="p-3 text-white mb-2" style="background-color:#fd7e14;">Card 3</div>
        </div>

        <div class="col-md-6">
          <div class="p-3 text-white mb-2" style="background-color:#dc3545;">Card 4</div>
        </div>

      </div>

    </div>

    <!-- Right Panel -->
    <div class="col-md-3 text-white p-3" style="background-color:#6f42c1;">
      <h5>Right Panel</h5>
      <p>Ads / Info</p>
    </div>

  </div>

</div>

</body>
</html>
